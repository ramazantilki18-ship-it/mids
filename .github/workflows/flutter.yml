name: Flutter APK Build & Release

on:
  # Tag push edildiğinde otomatik çalışır (örn: v1.0.17)
  push:
    tags:
      - 'v*'
  # Manuel tetikleme de mümkün
  workflow_dispatch:

# Release oluşturabilmesi için yazma izni
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Bağımlılıkları Yükle
        run: flutter pub get --no-example

      - name: APK Build (Release)
        run: flutter build apk --release

      - name: APK Dosya Bilgisi
        run: |
          echo "=== Build edilen APK ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          echo "SHA1:"
          sha1sum build/app/outputs/flutter-apk/app-release.apk

      # Sadece tag push edildiğinde Release oluştur
      - name: GitHub Release Oluştur
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Sürüm ${{ github.ref_name }}"
          body: |
            ## Denetim App ${{ github.ref_name }}

            Bu sürüm otomatik olarak build edilip yayınlanmıştır.

            **Commit:** ${{ github.sha }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
