name: denetim_app
description: Kurumsal Denetim Mobil Uygulaması
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  go_router: ^12.0.0
  image_picker: ^1.0.4
  fl_chart: ^0.65.0
  flutter_svg: ^2.1.0
  intl: 0.20.2
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  share_plus: ^7.2.1
  sqflite: ^2.3.0
  path: ^1.8.3
  sqflite_common_ffi: ^2.3.0
  sqlite3_flutter_libs: ^0.5.0
  sqflite_common_ffi_web: ^0.4.0
  pdf: ^3.10.0
  printing: ^5.11.0
  url_launcher: ^6.2.0
  http: ^1.1.0
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0

  path_provider: any
  universal_html: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
